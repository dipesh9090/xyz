<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Light Bulb Toggle</title>
  <style>
    body {
      text-align: center;
      padding-top: 50px;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    img {
      width: 150px;
      cursor: pointer;
      transition: filter 0.3s ease;
    }
    .caption {
      margin-top: 10px;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>Toggle Light Bulb</h1>
  <img id="bulb" src="https://www.w3schools.com/js/pic_bulboff.gif" alt="Light Bulb" onclick="toggleBulb()">
  <div class="caption" id="status">Light is OFF</div>

  <script>
    function toggleBulb() {
      const bulb = document.getElementById("bulb");
      const status = document.getElementById("status");
      if (bulb.src.includes("off")) {
        bulb.src = "https://www.w3schools.com/js/pic_bulbon.gif";
        status.textContent = "Light is ON";
      } else {
        bulb.src = "https://www.w3schools.com/js/pic_bulboff.gif";
        status.textContent = "Light is OFF";
      }
    }
  </script>
</body>
</html>
